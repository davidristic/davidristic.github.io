<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>David Ristič</title>

  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaossa/cmu-fonts-web@latest/cmu-fonts.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="/js/main.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <script>
  fetch("/nav.html")
    .then(r => r.text())
    .then(html => {
      const container = document.getElementById("navbar");
      container.innerHTML = html;

      // Normalize paths so "/" == "/index.html"
      const here = location.pathname.replace(/index\.html$/, "") || "/";
      container.querySelectorAll("a").forEach(a => {
        const url = new URL(a.getAttribute("href"), location.origin);
        const path = url.pathname.replace(/index\.html$/, "") || "/";
        if (path === here) {
          a.setAttribute("aria-current", "page"); // accessible + easy to style
          a.classList.add("active");              // optional class if you prefer
        }
      });
    });
  </script>


  <main class="home">
    <section aria-labelledby="home-title">
      <h1 id="home-title">David Ristič</h1>
      <nav class="home-actions" aria-label="Explore the website">
        <a href="/research/index.html">Research &amp; Publications</a>
        <a href="/music/index.html">Music &amp; Scores</a>
      </nav>
    </section>
  </main>

  <footer class="site-footer">
    © <span data-current-year>2026</span> David Ristič
  </footer>
</body>
</html>
